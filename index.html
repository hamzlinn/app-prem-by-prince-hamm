<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All App Prem by Prince Hamm</title>
    <style>
        /* ============================================ */
        /* 🔥 RESET & BASE */
        /* ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0a0a0f;
            position: relative;
            overflow-x: hidden;
            margin: 0;
        }

        /* ============================================ */
        /* 🔬 ATOM BACKGROUND — SMOOTH ANIMATION */
        /* ============================================ */

        .atom-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .atom-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            animation: atomOrbit linear infinite;
        }

        /* Orbit 1 — besar */
        .atom-particle:nth-child(1) {
            width: 6px;
            height: 6px;
            top: 20%;
            left: 10%;
            animation-duration: 18s;
            background: rgba(0, 255, 255, 0.2);
        }

        /* Orbit 2 — sedang */
        .atom-particle:nth-child(2) {
            width: 10px;
            height: 10px;
            top: 60%;
            left: 80%;
            animation-duration: 22s;
            background: rgba(255, 0, 200, 0.15);
        }

        /* Orbit 3 — kecil cepat */
        .atom-particle:nth-child(3) {
            width: 4px;
            height: 4px;
            top: 80%;
            left: 20%;
            animation-duration: 12s;
            background: rgba(0, 255, 255, 0.25);
        }

        /* Orbit 4 — besar pink */
        .atom-particle:nth-child(4) {
            width: 12px;
            height: 12px;
            top: 30%;
            left: 70%;
            animation-duration: 25s;
            background: rgba(255, 0, 200, 0.1);
        }

        /* Orbit 5 — kecil cyan */
        .atom-particle:nth-child(5) {
            width: 5px;
            height: 5px;
            top: 10%;
            left: 50%;
            animation-duration: 15s;
            background: rgba(0, 255, 255, 0.2);
        }

        /* Orbit 6 — sedang pink */
        .atom-particle:nth-child(6) {
            width: 8px;
            height: 8px;
            top: 50%;
            left: 30%;
            animation-duration: 20s;
            background: rgba(255, 0, 200, 0.12);
        }

        /* Orbit 7 — kecil */
        .atom-particle:nth-child(7) {
            width: 4px;
            height: 4px;
            top: 70%;
            left: 50%;
            animation-duration: 14s;
            background: rgba(0, 255, 255, 0.2);
        }

        /* Orbit 8 — besar */
        .atom-particle:nth-child(8) {
            width: 14px;
            height: 14px;
            top: 40%;
            left: 40%;
            animation-duration: 28s;
            background: rgba(255, 0, 200, 0.08);
        }

        @keyframes atomOrbit {
            0% {
                transform: rotate(0deg) translateX(80px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(80px) rotate(-360deg);
            }
        }

        /* Variasi orbit lebih jauh */
        .atom-particle:nth-child(odd) {
            animation-name: atomOrbitFar;
        }

        @keyframes atomOrbitFar {
            0% {
                transform: rotate(0deg) translateX(140px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(140px) rotate(-360deg);
            }
        }

        /* Tambahan glow di tengah */
        .atom-core {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 255, 255, 0.03), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: corePulse 6s ease-in-out infinite;
        }

        @keyframes corePulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        /* ============================================ */
        /* 📦 CONTAINER (GLASS + CYBER) */
        /* ============================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.08), inset 0 0 60px rgba(0, 255, 255, 0.03);
            animation: fadeSlideIn 1s ease-out;
        }

        @keyframes fadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================ */
        /* 🔥 HEADER */
        /* ============================================ */
        h1 {
            text-align: center;
            color: #00ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            animation: glitchText 3s infinite;
            cursor: default;
        }
        h1 svg {
            width: 34px;
            height: 34px;
            fill: #00ffff;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.5));
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.3));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(0, 255, 255, 0.7));
                transform: scale(1.05);
            }
        }
        @keyframes glitchText {
            0%,
            90%,
            100% {
                opacity: 1;
                transform: skew(0deg);
            }
            92% {
                opacity: 0.8;
                transform: skew(2deg);
            }
            94% {
                opacity: 1;
                transform: skew(-2deg);
            }
            96% {
                opacity: 0.9;
                transform: skew(1deg);
            }
        }

        .header-title {
            text-align: center;
            color: #7a8aaa;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: -6px;
            margin-bottom: 25px;
            font-weight: 400;
            opacity: 0.7;
        }

        /* ============================================ */
        /* 🧾 PRODUCT CARD */
        /* ============================================ */
        .product {
            background: rgba(0, 20, 30, 0.5);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 22px;
            border-left: 3px solid #00ffff;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }
        .product::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.05), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .product:hover::before {
            opacity: 1;
        }
        .product:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 40px -8px rgba(0, 255, 255, 0.2);
            border-left-color: #ff00c8;
        }
        .product h3 {
            margin: 0 0 6px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 19px;
            font-weight: 600;
        }
        .product h3 svg {
            width: 24px;
            height: 24px;
            fill: #ff00c8;
            filter: drop-shadow(0 0 6px rgba(255, 0, 200, 0.4));
        }
        .product p {
            color: #8a9ab0;
            font-size: 14px;
        }
        .product ul {
            color: #8a9ab0;
            padding-left: 22px;
            margin-top: 4px;
        }
        .product ul li {
            margin: 4px 0;
            list-style: none;
            position: relative;
        }
        .product ul li::before {
            content: '›';
            color: #00ffff;
            position: absolute;
            left: -16px;
            font-weight: bold;
        }

        /* ============================================ */
        /* 📝 FORM */
        /* ============================================ */
        .form-group {
            margin: 18px 0;
        }
        .form-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            color: #b0c0d0;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group label svg {
            width: 20px;
            height: 20px;
            fill: #00ffff;
            filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.2));
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            background: rgba(0, 20, 30, 0.6);
            color: #e0e8f0;
            font-size: 15px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 0 4px rgba(0, 255, 255, 0.12), 0 0 30px rgba(0, 255, 255, 0.06);
            background: rgba(0, 30, 40, 0.7);
        }

        /* ============================================ */
        /* 🚀 BUTTON */
        /* ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ffff, #0088cc);
            color: #000;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            margin-top: 6px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .btn:hover::after {
            opacity: 1;
        }
        .btn:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.35), inset 0 0 30px rgba(0, 255, 255, 0.1);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn svg {
            width: 22px;
            height: 22px;
            fill: #000;
        }

        /* ============================================ */
        /* 📢 CHANNEL BOX */
        /* ============================================ */
        .channel-box {
            background: rgba(0, 30, 20, 0.4);
            border: 1px solid rgba(0, 255, 100, 0.25);
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
            transition: all 0.4s ease;
            backdrop-filter: blur(4px);
        }
        .channel-box:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(0, 255, 100, 0.08);
            border-color: #00ff66;
        }
        .channel-box p {
            margin: 6px 0;
        }
        .channel-box .wa-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #00ff66, #00cc55);
            color: #000;
            padding: 12px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .channel-box .wa-link:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 255, 100, 0.3);
        }
        .channel-box .wa-link svg {
            width: 22px;
            height: 22px;
            fill: #000;
        }

        /* ============================================ */
        /* 📌 FOOTER */
        /* ============================================ */
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #4a5a70;
            font-size: 13px;
        }
        .footer p {
            margin: 5px 0;
        }

        /* ============================================ */
        /* 📱 RESPONSIVE */
        /* ============================================ */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 20px;
                flex-wrap: wrap;
            }
            .product h3 {
                font-size: 16px;
            }
            .btn {
                font-size: 14px;
                padding: 12px;
            }
        }

        /* ============================================ */
        /* 🔄 SCROLLBAR */
        /* ============================================ */
        ::-webkit-scrollbar {
            width: 6px;
            background: #0a0a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>

    <!-- 📜 JAVASCRIPT -->
    <!-- ============================================ -->
    <script>
        // ====================
        // 📩 FORM VALIDASI
        // ====================
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nama = document.getElementById('nama').value.trim();
            const wa = document.getElementById('wa').value.trim();
            const produk = document.getElementById('produk').value;

            if (!nama || !wa) {
                alert('⚠️ Harap isi nama dan nomor WhatsApp!');
                return;
            }

            let waClean = wa.replace(/\D/g, '');
            if (waClean.startsWith('0')) waClean = '62' + waClean.slice(1);
            if (!waClean.startsWith('62')) waClean = '62' + waClean;

            const pesan = `Halo Kak, saya mau pesan produk: ${produk}%0ANama: ${nama}%0ANo WA: ${wa}`;
            window.open(`https://wa.me/${waClean}?text=${pesan}`, '_blank');
        });
    </script>
