<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin — Prince Hamm</title>
    <style>
        /* ============================================ */
        /* 🔥 RESET & BASE */
        /* ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* ============================================ */
        /* 🔬 ATOM BACKGROUND (SAMA KAYAK INDEX) */
        /* ============================================ */
        .atom-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .atom-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            animation: atomOrbit linear infinite;
        }

        .atom-particle:nth-child(1) {
            width: 6px;
            height: 6px;
            top: 20%;
            left: 10%;
            animation-duration: 18s;
            background: rgba(0, 255, 255, 0.2);
        }
        .atom-particle:nth-child(2) {
            width: 10px;
            height: 10px;
            top: 60%;
            left: 80%;
            animation-duration: 22s;
            background: rgba(255, 0, 200, 0.15);
        }
        .atom-particle:nth-child(3) {
            width: 4px;
            height: 4px;
            top: 80%;
            left: 20%;
            animation-duration: 12s;
            background: rgba(0, 255, 255, 0.25);
        }
        .atom-particle:nth-child(4) {
            width: 12px;
            height: 12px;
            top: 30%;
            left: 70%;
            animation-duration: 25s;
            background: rgba(255, 0, 200, 0.1);
        }
        .atom-particle:nth-child(5) {
            width: 5px;
            height: 5px;
            top: 10%;
            left: 50%;
            animation-duration: 15s;
            background: rgba(0, 255, 255, 0.2);
        }
        .atom-particle:nth-child(6) {
            width: 8px;
            height: 8px;
            top: 50%;
            left: 30%;
            animation-duration: 20s;
            background: rgba(255, 0, 200, 0.12);
        }
        .atom-particle:nth-child(7) {
            width: 4px;
            height: 4px;
            top: 70%;
            left: 50%;
            animation-duration: 14s;
            background: rgba(0, 255, 255, 0.2);
        }
        .atom-particle:nth-child(8) {
            width: 14px;
            height: 14px;
            top: 40%;
            left: 40%;
            animation-duration: 28s;
            background: rgba(255, 0, 200, 0.08);
        }

        @keyframes atomOrbit {
            0% {
                transform: rotate(0deg) translateX(80px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(80px) rotate(-360deg);
            }
        }
        .atom-particle:nth-child(odd) {
            animation-name: atomOrbitFar;
        }
        @keyframes atomOrbitFar {
            0% {
                transform: rotate(0deg) translateX(140px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(140px) rotate(-360deg);
            }
        }

        .atom-core {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 255, 255, 0.03), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: corePulse 6s ease-in-out infinite;
        }

        @keyframes corePulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        /* ============================================ */
        /* 📦 CONTAINER */
        /* ============================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 850px;
            width: 100%;
            background: rgba(10, 10, 20, 0.8);
            backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.05);
            animation: fadeSlideIn 0.8s ease-out;
        }

        @keyframes fadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #00ffff;
            text-align: center;
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .subtitle {
            text-align: center;
            color: #7a8aaa;
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* ============================================ */
        /* 📊 STATISTIK */
        /* ============================================ */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-item {
            background: rgba(0, 20, 30, 0.4);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.08);
        }

        .stat-item .number {
            font-size: 28px;
            font-weight: 700;
            color: #00ffff;
        }
        .stat-item .label {
            font-size: 13px;
            color: #7a8aaa;
            margin-top: 4px;
        }

        /* ============================================ */
        /* 🧾 CARD */
        /* ============================================ */
        .card {
            background: rgba(0, 20, 30, 0.5);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border-left: 3px solid #00ffff;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-left-color: #ff00c8;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.05);
        }
        .card h3 {
            color: #fff;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
        }
        .card h3 span {
            color: #00ffff;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .row input,
        .row select {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            min-width: 120px;
            font-size: 14px;
        }
        .row input:focus,
        .row select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
        }

        /* ============================================ */
        /* 🎨 BUTTONS */
        /* ============================================ */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-primary {
            background: #00ffff;
            color: #000;
        }
        .btn-primary:hover {
            background: #00ddff;
            transform: scale(1.02);
        }
        .btn-pink {
            background: #ff00c8;
            color: #fff;
        }
        .btn-pink:hover {
            background: #cc00a0;
            transform: scale(1.02);
        }
        .btn-green {
            background: #00ff66;
            color: #000;
        }
        .btn-green:hover {
            background: #00dd55;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #ff2244;
            color: #fff;
        }
        .btn-danger:hover {
            background: #cc0033;
            transform: scale(1.02);
        }
        .btn-warning {
            background: #ff8800;
            color: #000;
        }
        .btn-warning:hover {
            background: #dd7700;
            transform: scale(1.02);
        }

        /* ============================================ */
        /* 📌 LAINNYA */
        /* ============================================ */
        .word-list {
            color: #ff00c8;
            font-weight: 500;
            word-break: break-all;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #4a5a70;
            font-size: 13px;
        }

        .logout-btn {
            background: none;
            border: 1px solid #4a5a70;
            color: #4a5a70;
            padding: 5px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .logout-btn:hover {
            color: #00ffff;
            border-color: #00ffff;
        }

        /* ============================================ */
        /* 📱 RESPONSIVE */
        /* ============================================ */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 22px;
            }
            .row {
                flex-direction: column;
            }
            .stat-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ============================================ */
        /* 🔄 SCROLLBAR */
        /* ============================================ */
        ::-webkit-scrollbar {
            width: 6px;
            background: #0a0a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- 🔬 ATOM BACKGROUND -->
    <!-- ============================================ -->
    <div class="atom-bg">
        <div class="atom-particle"></div>
        <div class="atom-particle"></div>
        <div class="atom-particle"></div>
        <div class="atom-particle"></div>
        <div class="atom-particle"></div>
        <div class="atom-particle"></div>
        <div class="atom-particle"></div>
        <div class="atom-particle"></div>
    </div>
    <div class="atom-core"></div>

    <!-- ============================================ -->
    <!-- 📦 MAIN CONTENT -->
    <!-- ============================================ -->
    <div class="container">
        <h1>⚙️ Dashboard Admin</h1>
        <p class="subtitle">Prince Hamm — All App Prem</p>

        <!-- ==================== -->
        <!-- 📊 STATISTIK -->
        <!-- ==================== -->
        <div class="stat-grid">
            <div class="stat-item">
                <div class="number" id="totalProducts">0</div>
                <div class="label">Total Produk</div>
            </div>
            <div class="stat-item">
                <div class="number" id="blockedWords">0</div>
                <div class="label">Kata Terblokir</div>
            </div>
            <div class="stat-item">
                <div class="number" id="totalOrders">0</div>
                <div class="label">Pesanan Masuk</div>
            </div>
        </div>

        <!-- ==================== -->
        <!-- 📦 KELOLA PRODUK -->
        <!-- ==================== -->
        <div class="card">
            <h3>📦 <span>Kelola Produk</span></h3>
            <div class="row" style="margin-bottom: 10px;">
                <input type="text" id="productName" placeholder="Nama produk">
                <input type="number" id="productPrice" placeholder="Harga">
                <button class="btn btn-green" onclick="addProduct()">+ Tambah</button>
            </div>
            <div style="margin-top: 12px;">
                <label style="color: #b0c0d0; font-size: 14px;">Pilih produk untuk dihapus:</label>
                <div style="display: flex; gap: 10px; margin-top: 6px;">
                    <select id="productList" style="flex:1; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(0,255,255,0.15); background: rgba(0,0,0,0.4); color: #fff;"></select>
                    <button class="btn btn-danger" onclick="deleteProduct()">Hapus</button>
                </div>
            </div>
        </div>

        <!-- ==================== -->
        <!-- 🚫 KATA TERLARANG -->
        <!-- ==================== -->
        <div class="card">
            <h3>🚫 <span>Kata Terlarang</span></h3>
            <div class="row" style="margin-bottom: 10px;">
                <input type="text" id="newWord" placeholder="Tambah kata">
                <button class="btn btn-pink" onclick="addWord()">Tambah</button>
            </div>
            <p style="color: #b0b0c0; font-size: 14px;">Daftar: <span class="word-list" id="wordList"></span></p>
            <button class="btn btn-danger" onclick="resetWords()" style="margin-top: 8px;">Reset ke Default</button>
        </div>

        <!-- ==================== -->
        <!-- 🔧 PENGATURAN -->
        <!-- ==================== -->
        <div class="card">
            <h3>🔧 <span>Pengaturan</span></h3>
            <div class="row" style="margin-bottom: 10px;">
                <input type="text" id="newTitle" placeholder="Judul web baru">
                <button class="btn btn-warning" onclick="changeTitle()">Ganti Judul</button>
            </div>
            <div class="row">
                <input type="text" id="newAdminKey" placeholder="Kode admin baru">
                <button class="btn btn-warning" onclick="changeAdminKey()">Ganti Kode</button>
            </div>
            <button class="btn btn-danger" onclick="resetAll()" style="margin-top: 12px;">🔄 Reset Semua ke Default</button>
        </div>

        <!-- ==================== -->
        <!-- 🚪 LOGOUT -->
        <!-- ==================== -->
        <div style="text-align: right;">
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>

        <div class="footer">
            <p>© 2026 Pangeran Hamm. All Rights Reserved.</p>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- 📜 JAVASCRIPT -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // 🔒 DATA DEFAULT
        // ============================================
        let forbiddenWords = ["anjing", "babi", "kontol", "memek", "ngentot", "goblok", "tolol", "bangsat", "pecun", "asw", "jancok", "cuk", "pukimak", "bacot", "kampret", "bego", "idiot", "setan", "sialan"];
        let products = [
            { name: "Private 1 Tahun", price: 5000 },
            { name: "Sharing", price: 2000 }
        ];
        let adminKey = "prince hamm str";

        // ============================================
        // 🔄 UPDATE UI
        // ============================================
        function updateUI() {
            // Update daftar produk
            const select = document.getElementById('productList');
            select.innerHTML = '';
            products.forEach((p, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${p.name} — Rp ${p.price.toLocaleString()}`;
                select.appendChild(opt);
            });
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('wordList').textContent = forbiddenWords.join(', ');
            document.getElementById('blockedWords').textContent = forbiddenWords.length;
            document.getElementById('totalOrders').textContent = Math.floor(Math.random() * 20);
        }

        // ============================================
        // 📦 KELOLA PRODUK
        // ============================================
        function addProduct() {
            const name = document.getElementById('productName').value.trim();
            const price = parseInt(document.getElementById('productPrice').value);
            if (!name || isNaN(price) || price <= 0) {
                alert('⚠️ Masukkan nama dan harga yang valid!');
                return;
            }
            products.push({ name, price });
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            updateUI();
            alert('✅ Produk berhasil ditambahkan!');
        }

        function deleteProduct() {
            const select = document.getElementById('productList');
            const index = parseInt(select.value);
            if (isNaN(index)) return alert('⚠️ Pilih produk!');
            if (confirm(`Hapus produk "${products[index].name}"?`)) {
                products.splice(index, 1);
                updateUI();
                alert('✅ Produk dihapus!');
            }
        }

        // ============================================
        // 🚫 KATA TERLARANG
        // ============================================
        function addWord() {
            const input = document.getElementById('newWord');
            const word = input.value.trim().toLowerCase();
            if (!word) return alert('⚠️ Masukkan kata!');
            if (forbiddenWords.includes(word)) return alert('⚠️ Kata sudah ada!');
            forbiddenWords.push(word);
            input.value = '';
            updateUI();
            alert('✅ Kata berhasil ditambahkan!');
        }

        function resetWords() {
            if (!confirm('Reset kata terlarang ke default?')) return;
            forbiddenWords = ["anjing", "babi", "kontol", "memek", "ngentot", "goblok", "tolol", "bangsat", "pecun", "asw", "jancok", "cuk", "pukimak", "bacot", "kampret", "bego", "idiot", "setan", "sialan"];
            updateUI();
            alert('✅ Reset berhasil!');
        }

        // ============================================
        // 🔧 PENGATURAN
        // ============================================
        function changeTitle() {
            const title = document.getElementById('newTitle').value.trim();
            if (!title) return alert('⚠️ Masukkan judul baru!');
            localStorage.setItem('webTitle', title);
            alert('✅ Judul berhasil diubah! (refresh halaman utama)');
        }

        function changeAdminKey() {
            const newKey = document.getElementById('newAdminKey').value.trim();
            if (!newKey) return alert('⚠️ Masukkan kode baru!');
            adminKey = newKey;
            alert('✅ Kode admin berhasil diubah!');
        }

        function resetAll() {
            if (!confirm('⚠️ Yakin reset semua ke default?')) return;
            products = [
                { name: "Private 1 Tahun", price: 5000 },
                { name: "Sharing", price: 2000 }
            ];
            forbiddenWords = ["anjing", "babi", "kontol", "memek", "ngentot", "goblok", "tolol", "bangsat", "pecun", "asw", "jancok", "cuk", "pukimak", "bacot", "kampret", "bego", "idiot", "setan", "sialan"];
            adminKey = "prince hamm str";
            updateUI();
            alert('✅ Reset semua berhasil!');
        }

        // ============================================
        // 🚪 LOGOUT
        // ============================================
        function logout() {
            if (confirm('Logout dari dashboard?')) {
                window.location.href = 'index.html';
            }
        }

        // ============================================
        // 🔐 AKSES DASHBOARD (CEK KODE ADMIN)
        // ============================================
        function checkAccess() {
            const key = prompt("🔐 Masukkan Kode Admin:");
            if (key === adminKey) {
                document.querySelector('.container').style.display = 'block';
                updateUI();
                document.querySelector('.login-screen')?.remove();
            } else {
                alert("❌ Kode salah! Halaman akan dimuat ulang.");
                window.location.reload();
            }
        }

        // ============================================
        // 🚀 INIT (TAMPILKAN LOGIN)
        // ============================================
        // Sembunyikan container dulu
        document.querySelector('.container').style.display = 'none';

        // Buat layar login
        const loginDiv = document.createElement('div');
        loginDiv.className = 'login-screen';
        loginDiv.style.cssText = `
                position: relative;
                z-index: 2;
                background: rgba(10,10,20,0.85);
                backdrop-filter: blur(16px);
                padding: 40px;
                border-radius: 24px;
                border: 1px solid rgba(0,255,255,0.2);
                max-width: 400px;
                width: 100%;
                text-align: center;
                box-shadow: 0 0 60px rgba(0,255,255,0.05);
                animation: fadeSlideIn 0.8s ease-out;
            `;
        loginDiv.innerHTML = `
                <h2 style="color: #00ffff; margin-bottom: 10px;">🔐 Admin Dashboard</h2>
                <p style="color: #7a8aaa; margin-bottom: 20px;">Masukkan kode untuk mengakses</p>
                <input type="password" id="loginKey" placeholder="Kode Admin" style="width:100%; padding:12px 16px; border-radius:12px; border:1px solid rgba(0,255,255,0.15); background:rgba(0,20,30,0.6); color:#fff; font-size:16px; margin-bottom:15px;">
                <button onclick="checkAccess()" style="width:100%; padding:14px; background:linear-gradient(135deg, #00ffff, #0088cc); color:#000; font-weight:700; border:none; border-radius:14px; cursor:pointer; font-size:16px;">Login</button>
            `;

        // Masukkan ke body
        document.body.prepend(loginDiv);

        // Fungsi login override
        window.checkAccess = function() {
            const input = document.getElementById('loginKey');
            const key = input.value.trim();
            if (key === adminKey) {
                loginDiv.style.display = 'none';
                document.querySelector('.container').style.display = 'block';
                updateUI();
            } else {
                alert("❌ Kode salah!");
                input.value = '';
                input.focus();
            }
        };

        // Enter key
        document.getElementById('loginKey').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') window.checkAccess();
        });
    </script>

</body>
</html>
